# GitHub Actions workflow para ejecutar ML Pipeline con Prefect
# Demuestra integración de Prefect en CI/CD

name: 🤖 ML Pipeline with Prefect

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/prefect_workflows/**'
      - 'examples/prefect/**'
      - '.github/workflows/prefect/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/prefect_workflows/**'
      - 'examples/prefect/**'
      - '.github/workflows/prefect/**'

env:
  PYTHON_VERSION: '3.10'
  PREFECT_API_URL: http://127.0.0.1:4200/api  # Para desarrollo local

jobs:
  # =============================================================================
  # JOB 1: VALIDACIÓN DE PREFECT FLOWS
  # =============================================================================
  validate-prefect:
    name: 🔍 Validate Prefect Flows
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Prefect and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prefect>=2.0.0

      - name: 🔍 Validate Prefect flow syntax
        run: |
          echo "🔍 Validando sintaxis de Prefect flows..."
          python -c "
          import sys
          sys.path.insert(0, 'src')
          try:
              from prefect_workflows.ml_pipeline_flow import ml_training_pipeline
              from prefect_workflows.config import get_config
              print('✅ ml_pipeline_flow importado correctamente')
              config = get_config('development')
              print('✅ Configuración cargada correctamente')
              print('✅ Todos los flows válidos')
          except Exception as e:
              print(f'❌ Error en validación: {e}')
              sys.exit(1)
          "

      - name: 🧪 Test Prefect flow execution (dry run)
        run: |
          echo "🧪 Probando ejecución básica de flows..."
          python -c "
          from examples.prefect.basic_flow_example import basic_math_flow
          result = basic_math_flow(2, 3)
          expected = (2+3)*2 + 2 + 3 + (2+3) + ((2+3)*2)  # 35
          assert result == expected, f'Expected {expected}, got {result}'
          print('✅ Basic flow ejecutado correctamente')
          "

  # =============================================================================
  # JOB 2: EJECUTAR DEMO DE PREFECT FLOWS
  # =============================================================================
  run-prefect-demo:
    name: 🚀 Run Prefect Demo
    runs-on: ubuntu-latest
    needs: validate-prefect

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prefect>=2.0.0

      - name: 🚀 Run Basic Prefect Example
        run: |
          echo "🎭 Ejecutando ejemplo básico de Prefect..."
          python examples/prefect/basic_flow_example.py

      - name: 🎪 Run Advanced Prefect Example
        run: |
          echo "🎪 Ejecutando ejemplo avanzado de Prefect..."
          python examples/prefect/advanced_flow_example.py

      - name: 📊 Run Complete ML Pipeline Demo
        run: |
          echo "🤖 Ejecutando pipeline completo de ML con Prefect..."
          python examples/prefect/ml_pipeline_complete.py

  # =============================================================================
  # JOB 3: INTEGRACIÓN CON SERVIDOR PREFECT (OPCIONAL)
  # =============================================================================
  prefect-integration:
    name: 🔗 Prefect Server Integration
    runs-on: ubuntu-latest
    needs: run-prefect-demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Prefect CLI
        run: |
          python -m pip install --upgrade pip
          pip install prefect>=2.0.0

      - name: 🔧 Configure Prefect for Cloud (if secrets available)
        run: |
          if [ -n "${{ secrets.PREFECT_API_KEY }}" ]; then
            echo "🔑 Configurando Prefect Cloud..."
            prefect cloud login --key ${{ secrets.PREFECT_API_KEY }}
            prefect config set PREFECT_API_URL=${{ secrets.PREFECT_API_URL }}
          else
            echo "⚠️ Prefect Cloud no configurado, usando modo local"
          fi

      - name: 📤 Deploy Flows to Prefect (Optional)
        run: |
          echo "📤 Registrando flows en Prefect..."
          # En un escenario real, aquí se desplegarían los flows
          echo "✅ Flows registrados (simulado)"

      - name: 🎯 Create and Run Deployment (Demo)
        run: |
          echo "🎯 Creando deployment de ejemplo..."
          python -c "
          from src.prefect_workflows.ml_pipeline_flow import ml_training_pipeline
          from src.data_utils import generate_sample_data
          import tempfile
          import os

          # Crear datos de prueba
          df = generate_sample_data(100, 4, 42)
          with tempfile.NamedTemporaryFile(mode='w', suffix='.csv', delete=False) as f:
              df.to_csv(f.name, index=False)
              data_path = f.name

          try:
              # Ejecutar flow
              results = ml_training_pipeline(data_path, model_name='ci-test')
              print('✅ Flow ejecutado exitosamente en CI')
              print('.4f'          finally:
              os.unlink(data_path)
          "

  # =============================================================================
  # JOB 4: LIMPIEZA Y REPORTING
  # =============================================================================
  cleanup-and-report:
    name: 🧹 Cleanup & Generate Report
    runs-on: ubuntu-latest
    needs: [validate-prefect, run-prefect-demo]
    if: always()  # Ejecutar siempre, incluso si jobs anteriores fallan

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: pip install -e ".[dev]"

      - name: 📊 Generate Prefect Integration Report
        run: |
          echo "## 🤖 Prefect Integration Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validate Prefect: ${{ needs.validate-prefect.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run Demo: ${{ needs.run-prefect-demo.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Server Integration: ${{ needs.prefect-integration.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📚 Examples Executed" >> $GITHUB_STEP_SUMMARY
          echo "- Basic flow operations" >> $GITHUB_STEP_SUMMARY
          echo "- Error handling and retries" >> $GITHUB_STEP_SUMMARY
          echo "- Complete ML pipeline orchestration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Key Achievements" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Flows syntax validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Task execution and dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Error handling and recovery" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ML pipeline orchestration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status == 'success' && '🎉 All Prefect integrations working!' || '⚠️ Some issues detected' }}" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Clean up generated files
        run: |
          echo "🧹 Limpiando archivos generados..."
          rm -rf data/ models/ logs/ *.log
          echo "✅ Limpieza completada"

      - name: 📸 Upload workflow artifacts (if any)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: prefect-workflow-results
          path: |
            *.log
            data/
            models/
          retention-days: 7
